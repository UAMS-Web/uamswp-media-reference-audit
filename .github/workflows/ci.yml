name: CI

# The checks every UAMS-Web plugin runs, called from the shared chain in
# `UAMS-Web/uams-ci-workflows` so one definition serves every repository and this one carries
# no copy that drifts. The call switches on the three plugin jobs this repository uses
# (`floor-lint`, `download-archive`, `phpcs`), runs the unit suite as `composer test:unit`, and keeps
# the Linux, Windows and macOS legs of the jobs the chain classifies for all three, with `linux-only: false`.
# The chain's own header lists every input and its default.
#
# The `mutate` job runs `composer mutate` on `ubuntu-latest` with PCOV. It mutates the lines of `includes/`
# that the Unit suite covers: code reachable only from the Integration suite (PHPUnit 9.6, which Pest cannot
# run) is pinned there and is not in the job's population.
#
# `integration` stays here as a plain job beside the call, because its MySQL service and the
# WordPress download are not part of the chain. It runs the Integration suite on a real WordPress
# in single and multisite modes, on the WordPress release that `wp-phpunit` in
# `tests/Integration/composer.json` is pinned to.
#
# `legs` calls the shared `runner-legs.yml`, which checks that the call's run put every job on
# the runners its classification names. Its pin must name the same commit as the `checks` pin,
# so the two move together.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the call,
# `legs` and `integration`, runs `if: always()`, and fails unless every needed job reports `success`: a
# `skipped` or `cancelled` job fails it. Adding a plain job here means adding it to the
# `needs:` list of `CI`; the `aggregate-needs` job in the chain fails the pull request when
# one is missing. Do not rename `CI`, and do not rename `checks` without changing `needs:`.
#
# The repository is public, so the chain runs on every pull request with no gate. What it
# carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, and the Composer
# scripts `test:pint`, `test:refactor`, `stan` and `test:unit`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, Monday 07:17 UTC (about 01:17 Central). A scheduled run mutates everything `composer mutate`
  # covers, under the chain's `mutate-full-timeout-minutes` (default 180), so it catches decay no pull
  # request touches. A pull request keeps the 45-minute `mutate-timeout-minutes` cap. A schedule runs on
  # the default branch, and GitHub disables it after 60 days without repository activity.
  schedule:
    - cron: '17 7 * * 1'

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to a release tag, never a branch. To take a newer chain, move the pin to the next tag.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.17.0
    with:
      mutate: true
      # v0.17.0 runs every job on `ubuntu-latest` unless told otherwise. `false` keeps each job's own
      # classification, which here is the Windows and macOS legs of `pest` and `mutate-ignore` that the
      # `v0.13.0` pin ran: macOS and Windows are both supported development platforms for this repository.
      linux-only: false
      # A pull request or a push mutates the changed files under these paths; a manual run mutates
      # everything `composer mutate` covers.
      mutate-paths: includes uamswp-media-reference-audit.php
      mutate-ignore-paths: includes
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      phpcs: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  # Checks that the run of `checks` above ran every job on the runners its classification names.
  legs:
    needs: [checks]
    if: always()
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/runner-legs.yml@v0.17.0
    permissions:
      contents: read
      actions: read
      checks: read

  integration:
    name: Integration (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [single, multisite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: uamswp_mra_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_ABSPATH: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_MULTISITE: ${{ matrix.mode == 'multisite' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          integration: 'true'
      # The WordPress core copy the suite boots, matching wp-phpunit in tests/Integration/composer.json.
      - name: Download WordPress
        env:
          WP_VERSION: '7.1.4'
        run: |
          mkdir -p "$WP_TESTS_ABSPATH"
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz -C "$WP_TESTS_ABSPATH" --strip-components=1
      - run: composer test:integration

  # The one check a ruleset requires from this workflow.
  ci:
    name: CI
    needs: [checks, legs, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
